name: Gempa Indonesia CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  client-verification:
    name: Client (Frontend) Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Runner GitHub Actions tidak menyertakan pnpm secara default.
      # Action ini harus dieksekusi sebelum setup-node agar fitur cache pnpm dapat mendeteksi binary di PATH.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      # Instalasi dijalankan di workspace root menggunakan --frozen-lockfile.
      # Hal ini wajib agar pnpm menghubungkan internal workspace dependencies (@trackly/types).
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm --filter web lint

      # NEXT_PUBLIC_API_URL disediakan saat build untuk mencegah error inlining environment variable Next.js
      - name: Test Build Production
        run: pnpm --filter web build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001

  server-verification:
    name: Server (Backend) Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # Prisma Client wajib di-generate terlebih dahulu agar tipe database ter-compile sebelum linting, test, atau build
      - name: Generate Prisma Client
        run: pnpm --filter api exec prisma generate

      - name: Run oxlint
        run: pnpm --filter api lint

      - name: Run Vitest Suite
        run: pnpm --filter api test

      - name: Build NestJS Production Bundle
        run: pnpm --filter api build

  docker-build:
    name: Verify Docker Image Build
    runs-on: ubuntu-latest
    needs: [client-verification, server-verification]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Gunakan buildx untuk standardisasi build engine dan pemanfaatan layer caching
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build context harus diarahkan ke root (.) karena Dockerfile menyalin konfigurasi pnpm-workspace dan packages/types
      - name: Build Server (API) Docker Image
        run: docker build -f apps/api/Dockerfile -t gempa-indonesia-api:ci .

      - name: Build Client (Web) Docker Image
        run: docker build -f apps/web/Dockerfile -t gempa-indonesia-web:ci .
