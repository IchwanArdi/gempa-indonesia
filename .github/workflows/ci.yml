name: Gempa Indonesia CI Pipeline

# Pemicu (triggers) dijalankan otomatis saat ada aktivitas push atau pull request pada branch utama
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Pembatasan hak akses token global secara default untuk meminimalkan celah keamanan (Least Privilege)
permissions:
  contents: read

jobs:
  # Job 1: Melakukan verifikasi kode dan kompilasi pada aplikasi sisi klien (Frontend)
  client-verification:
    name: Client (Frontend) Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Menginstalisasi package manager pnpm.
      # Harus dieksekusi sebelum setup-node agar integrasi caching dapat mengenali path pnpm secara global.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      # Inisialisasi runtime Node.js dengan mengaktifkan fitur caching bawaan untuk dependensi pnpm
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      # Instalasi dependensi dengan opsi --frozen-lockfile untuk menjamin tidak ada perubahan
      # versi package dari file lock asli selama proses CI berlangsung.
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # Validasi kualitas kode statis khusus untuk workspace web
      - name: Run ESLint
        run: pnpm --filter web lint

      # Pengujian kompilasi produksi. Variabel lingkungan NEXT_PUBLIC_API_URL disuntikkan secara eksplisit
      # karena Next.js melakukan inlining variabel env ke dalam bundle saat proses build berlangsung.
      - name: Test Build Production
        run: pnpm --filter web build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3002

  # Job 2: Melakukan verifikasi kode, pengujian unit, dan kompilasi pada aplikasi sisi server (Backend)
  server-verification:
    name: Server (Backend) Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Menginstalisasi package manager pnpm (Tahapan terisolasi dari job client)
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      # Mengunduh dependensi monorepo untuk seluruh ekosistem backend
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # Pembuatan kode Typescript internal dari skema Prisma.
      # Langkah ini wajib dieksekusi sebelum proses linting dan testing agar tipe data database tersedia bagi compiler.
      - name: Generate Prisma Client
        run: pnpm --filter api exec prisma generate

      # Analisis kode statis backend menggunakan linter performa tinggi (oxlint)
      - name: Run oxlint
        run: pnpm --filter api lint

      # Mengeksekusi unit testing menggunakan framework Vitest
      - name: Run Vitest Suite
        run: pnpm --filter api test

      # Kompilasi aplikasi NestJS menjadi berkode JavaScript produksi siap edar
      - name: Build NestJS Production Bundle
        run: pnpm --filter api build

  # Job 3: Proses pengemasan aplikasi ke dalam kontainer Docker dan distribusi ke registry
  docker-build:
    name: Verify Docker Image Build
    runs-on: ubuntu-latest
    needs: [client-verification, server-verification]

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Menggunakan GitHub Action resmi untuk menyederhanakan alur kerja.
      # Parameter 'push' dikendalikan secara dinamis berdasarkan event trigger untuk efisiensi resource CI.
      - name: Build and Push Server (API)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          # Proses push ke remote registry hanya diaktifkan jika event berupa push/merge ke branch main
          push: ${{ github.event_name == 'push' }}
          # Mendukung deklarasi multi-tag secara langsung tanpa memerlukan perintah internal shell 'docker tag'
          tags: |
            ghcr.io/ichwanardi/gempa-indonesia-server:latest
            ghcr.io/ichwanardi/gempa-indonesia-server:${{ github.sha }}

      # Mengulang parameterisasi yang sama untuk kontainer sisi klien (Frontend) secara terisolasi
      - name: Build and Push Client (Web)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/ichwanardi/gempa-indonesia-client:latest
            ghcr.io/ichwanardi/gempa-indonesia-client:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=http://202.155.90.183:3002
